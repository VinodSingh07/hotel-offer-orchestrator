services:
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  supplier:
    build: .
    command: npm run supplier:prod
    ports:
      - "4000:4000"
    environment:
      - SUPPLIER_PORT=4000

  app:
    build: .
    command: npm start
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TEMPORAL_ADDRESS=temporal:7233
      - REDIS_URL=redis://redis:6379
      - SUPPLIER_BASE_URL=http://supplier:4000
    depends_on:
      - temporal
      - redis
      - supplier

  worker:
    build: .
    command: npm run worker:prod
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - SUPPLIER_BASE_URL=http://supplier:4000
    depends_on:
      - temporal
      - supplier